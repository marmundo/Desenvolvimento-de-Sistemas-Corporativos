<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -110 1280 870" font-family="Segoe UI, Arial, sans-serif">
<rect x="0" y="-110" width="1280" height="870" fill="#f8fafc"/>
<!-- Java world -->
<rect x="50" y="110" width="450" height="520" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
<text x="275" y="155" text-anchor="middle" font-size="26" font-weight="700" fill="#075985">Mundo Java (objetos)</text>
<rect x="90" y="185" width="370" height="130" rx="10" fill="#fff" stroke="#0284c7" stroke-width="2"/>
<text x="275" y="215" text-anchor="middle" font-size="22" font-weight="700" fill="#0c4a6e">class User</text>
<text x="110" y="248" font-size="19" fill="#334155">Long id; String name;</text>
<text x="110" y="278" font-size="19" fill="#334155">List&lt;Task&gt; tasks;  (referência)</text>
<rect x="90" y="345" width="370" height="130" rx="10" fill="#fff" stroke="#0284c7" stroke-width="2"/>
<text x="275" y="375" text-anchor="middle" font-size="22" font-weight="700" fill="#0c4a6e">class Task</text>
<text x="110" y="408" font-size="19" fill="#334155">Long id; String title;</text>
<text x="110" y="438" font-size="19" fill="#334155">User owner;  (referência)</text>
<text x="275" y="520" text-anchor="middle" font-size="19" fill="#0c4a6e">Herança, polimorfismo, grafos,</text>
<text x="275" y="548" text-anchor="middle" font-size="19" fill="#0c4a6e">encapsulamento, enums</text>
<text x="275" y="600" text-anchor="middle" font-size="18" font-style="italic" fill="#475569">Navega-se por referências</text>
<!-- ORM -->
<rect x="540" y="270" width="200" height="180" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
<text x="640" y="320" text-anchor="middle" font-size="26" font-weight="700" fill="#92400e">ORM</text>
<text x="640" y="352" text-anchor="middle" font-size="19" fill="#92400e">Hibernate</text>
<text x="640" y="380" text-anchor="middle" font-size="19" fill="#92400e">+ Spring Data JPA</text>
<text x="640" y="415" text-anchor="middle" font-size="16" fill="#92400e">o "tradutor"</text>
<path d="M505 360 H540" stroke="#d97706" stroke-width="4" marker-end="url(#a)"/>
<path d="M775 360 H740" stroke="#d97706" stroke-width="4" marker-start="url(#b)"/>
<path d="M540 330 H505" stroke="#d97706" stroke-width="4"/>
<path d="M740 330 H775" stroke="#d97706" stroke-width="4"/>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d97706"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10z" fill="#d97706"/></marker>
</defs>
<!-- DB world -->
<rect x="780" y="110" width="450" height="520" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
<text x="1005" y="155" text-anchor="middle" font-size="26" font-weight="700" fill="#166534">Mundo relacional (tabelas)</text>
<rect x="820" y="185" width="370" height="130" rx="10" fill="#fff" stroke="#16a34a" stroke-width="2"/>
<text x="1005" y="215" text-anchor="middle" font-size="22" font-weight="700" fill="#14532d">tabela users</text>
<text x="840" y="248" font-size="19" fill="#334155">id (PK) | name</text>
<text x="840" y="278" font-size="19" fill="#334155">1 | Ana  ·  2 | Bruno</text>
<rect x="820" y="345" width="370" height="130" rx="10" fill="#fff" stroke="#16a34a" stroke-width="2"/>
<text x="1005" y="375" text-anchor="middle" font-size="22" font-weight="700" fill="#14532d">tabela tasks</text>
<text x="840" y="408" font-size="19" fill="#334155">id (PK) | title | user_id (FK)</text>
<text x="840" y="438" font-size="19" fill="#334155">10 | Estudar JPA | 1</text>
<text x="1005" y="520" text-anchor="middle" font-size="19" fill="#14532d">Linhas, colunas, chaves,</text>
<text x="1005" y="548" text-anchor="middle" font-size="19" fill="#14532d">JOINs, tipos SQL</text>
<text x="1005" y="600" text-anchor="middle" font-size="18" font-style="italic" fill="#475569">Navega-se por chaves estrangeiras</text>
</svg>
