<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -110 1280 870" font-family="Segoe UI, Arial, sans-serif">
<rect x="0" y="-110" width="1280" height="870" fill="#f8fafc"/>
<!-- Java side -->
<text x="320" y="110" text-anchor="middle" font-size="24" font-weight="700" fill="#075985">Entidades Java</text>
<rect x="80" y="130" width="480" height="150" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.5"/>
<text x="110" y="165" font-size="21" font-weight="700" fill="#0c4a6e">@Entity User</text>
<text x="110" y="200" font-size="19" fill="#334155">@Id Long id;</text>
<text x="110" y="230" font-size="19" fill="#334155">String name;</text>
<text x="110" y="260" font-size="19" font-weight="700" fill="#b45309">@OneToMany(mappedBy="owner") List&lt;Task&gt; tasks;</text>
<rect x="80" y="400" width="480" height="150" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.5"/>
<text x="110" y="435" font-size="21" font-weight="700" fill="#0c4a6e">@Entity Task</text>
<text x="110" y="470" font-size="19" fill="#334155">@Id Long id;  String title;</text>
<text x="110" y="500" font-size="19" font-weight="700" fill="#b45309">@ManyToOne @JoinColumn(name="user_id")</text>
<text x="110" y="530" font-size="19" font-weight="700" fill="#b45309">User owner;</text>
<path d="M320 280 V400" stroke="#0284c7" stroke-width="3"/>
<text x="335" y="305" font-size="20" font-weight="700" fill="#0c4a6e">1</text>
<text x="335" y="390" font-size="20" font-weight="700" fill="#0c4a6e">N</text>
<!-- DB side -->
<text x="960" y="110" text-anchor="middle" font-size="24" font-weight="700" fill="#166534">Tabelas geradas</text>
<rect x="740" y="130" width="440" height="150" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
<text x="770" y="165" font-size="21" font-weight="700" fill="#14532d">users</text>
<text x="770" y="205" font-size="19" fill="#334155">id BIGINT  PK</text>
<text x="770" y="240" font-size="19" fill="#334155">name VARCHAR</text>
<rect x="740" y="400" width="440" height="150" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
<text x="770" y="435" font-size="21" font-weight="700" fill="#14532d">tasks</text>
<text x="770" y="470" font-size="19" fill="#334155">id BIGINT  PK  ·  title VARCHAR</text>
<text x="770" y="505" font-size="19" font-weight="700" fill="#b45309">user_id BIGINT  FK → users.id</text>
<path d="M960 280 V400" stroke="#16a34a" stroke-width="3" stroke-dasharray="8 6"/>
<path d="M560 475 H740" stroke="#d97706" stroke-width="3" stroke-dasharray="4 5"/>
<text x="650" y="462" text-anchor="middle" font-size="17" fill="#92400e">mapeia</text>
<text x="640" y="620" text-anchor="middle" font-size="21" fill="#475569">O lado dono da relação é quem possui a chave estrangeira: Task</text>
<text x="640" y="655" text-anchor="middle" font-size="18" fill="#475569">mappedBy indica que User apenas espelha o mapeamento definido em Task</text>
</svg>
