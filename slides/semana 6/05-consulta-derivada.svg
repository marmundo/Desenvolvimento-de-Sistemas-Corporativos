<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -110 1280 870" font-family="Segoe UI, Arial, sans-serif">
<rect x="0" y="-110" width="1280" height="870" fill="#f8fafc"/>
<g font-size="26" font-weight="700" text-anchor="middle">
<rect x="40" y="120" width="130" height="70" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.5"/><text x="105" y="165" fill="#075985">find</text>
<rect x="180" y="120" width="120" height="70" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2.5"/><text x="240" y="165" fill="#334155">By</text>
<rect x="310" y="120" width="170" height="70" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/><text x="395" y="165" fill="#5b21b6">Status</text>
<rect x="490" y="120" width="110" height="70" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2.5"/><text x="545" y="165" fill="#334155">And</text>
<rect x="610" y="120" width="180" height="70" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/><text x="700" y="165" fill="#5b21b6">Priority</text>
<rect x="800" y="120" width="130" height="70" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/><text x="865" y="165" fill="#92400e">OrderBy</text>
<rect x="940" y="120" width="180" height="70" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/><text x="1030" y="165" fill="#5b21b6">DueDate</text>
<rect x="1130" y="120" width="120" height="70" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/><text x="1190" y="165" fill="#92400e">Desc</text>
