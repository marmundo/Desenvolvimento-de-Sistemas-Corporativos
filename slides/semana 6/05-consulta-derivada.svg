<g font-size="18" text-anchor="middle" fill="#475569">
<text x="105" y="225">ação</text><text x="240" y="225">critério</text><text x="395" y="225">propriedade</text><text x="545" y="225">conector</text><text x="700" y="225">propriedade</text><text x="865" y="225">ordenação</text><text x="1030" y="225">propriedade</text><text x="1190" y="225">sentido</text>
</g>
<path d="M105 255 V300 M240 255 V300 M395 255 V300 M545 255 V300 M700 255 V300 M865 255 V300 M1030 255 V300 M1190 255 V300" stroke="#94a3b8" stroke-width="2"/>
<text x="640" y="345" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">O Spring Data lê o nome do método e monta o SQL</text>
<rect x="90" y="380" width="1100" height="230" rx="14" fill="#0f172a"/>
<g font-family="Consolas, monospace" font-size="24" fill="#e2e8f0">
<text x="130" y="435" fill="#7dd3fc">SELECT</text><text x="235" y="435"> t.* </text>
<text x="130" y="475" fill="#7dd3fc">FROM</text><text x="215" y="475"> tasks t</text>
<text x="130" y="515" fill="#7dd3fc">WHERE</text><text x="235" y="515"> t.status = ? </text><text x="470" y="515" fill="#7dd3fc">AND</text><text x="535" y="515"> t.priority = ?</text>
<text x="130" y="555" fill="#7dd3fc">ORDER BY</text><text x="290" y="555"> t.due_date </text><text x="480" y="555" fill="#7dd3fc">DESC</text>
</g>
<text x="640" y="665" text-anchor="middle" font-size="20" fill="#475569">Se a propriedade não existir na entidade, a aplicação falha ao iniciar</text>
