<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#37474F"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="460" fill="#FFFFFF"/>

  <text x="450" y="35" font-size="22" font-weight="700" fill="#263238" text-anchor="middle">Fluxo de dados: Controller, DTO, Service e Entity</text>

  <!-- Cliente -->
  <rect x="30" y="180" width="120" height="70" rx="10" fill="#ECEFF1" stroke="#546E7A" stroke-width="2"/>
  <text x="90" y="210" font-size="14" font-weight="600" text-anchor="middle" fill="#263238">Cliente</text>
  <text x="90" y="228" font-size="11" text-anchor="middle" fill="#546E7A">(JSON via HTTP)</text>

  <!-- Controller -->
  <rect x="200" y="170" width="150" height="90" rx="10" fill="#E3F2FD" stroke="#1976D2" stroke-width="2"/>
  <text x="275" y="200" font-size="14" font-weight="700" text-anchor="middle" fill="#0D47A1">@RestController</text>
  <text x="275" y="220" font-size="12" text-anchor="middle" fill="#1565C0">recebe TaskRequestDTO</text>
  <text x="275" y="238" font-size="12" text-anchor="middle" fill="#1565C0">devolve TaskResponseDTO</text>

  <!-- Service -->
  <rect x="400" y="170" width="150" height="90" rx="10" fill="#E8F5E9" stroke="#388E3C" stroke-width="2"/>
  <text x="475" y="195" font-size="14" font-weight="700" text-anchor="middle" fill="#1B5E20">@Service</text>
  <text x="475" y="215" font-size="12" text-anchor="middle" fill="#2E7D32">converte DTO ↔ Entity</text>
  <text x="475" y="233" font-size="12" text-anchor="middle" fill="#2E7D32">aplica regras de negócio</text>
  <text x="475" y="251" font-size="12" text-anchor="middle" fill="#2E7D32">(Strategy / Factory)</text>

  <!-- Repository -->
  <rect x="600" y="170" width="150" height="90" rx="10" fill="#FFF3E0" stroke="#F57C00" stroke-width="2"/>
  <text x="675" y="200" font-size="14" font-weight="700" text-anchor="middle" fill="#E65100">Repository</text>
  <text x="675" y="220" font-size="12" text-anchor="middle" fill="#EF6C00">trabalha com Task</text>
  <text x="675" y="238" font-size="12" text-anchor="middle" fill="#EF6C00">(Entity, não DTO)</text>

  <!-- Armazenamento -->
  <rect x="800" y="180" width="80" height="70" rx="10" fill="#ECEFF1" stroke="#546E7A" stroke-width="2"/>
  <text x="840" y="210" font-size="12" font-weight="600" text-anchor="middle" fill="#263238">Memória</text>
  <text x="840" y="228" font-size="10" text-anchor="middle" fill="#546E7A">(List/Map)</text>

  <!-- Setas de ida -->
  <line x1="150" y1="200" x2="196" y2="200" stroke="#37474F" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="350" y1="200" x2="396" y2="200" stroke="#37474F" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="550" y1="200" x2="596" y2="200" stroke="#37474F" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="750" y1="205" x2="796" y2="205" stroke="#37474F" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Setas de volta -->
  <line x1="796" y1="235" x2="754" y2="235" stroke="#90A4AE" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <line x1="596" y1="235" x2="554" y2="235" stroke="#90A4AE" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <line x1="396" y1="235" x2="354" y2="235" stroke="#90A4AE" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <line x1="196" y1="235" x2="154" y2="235" stroke="#90A4AE" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <text x="450" y="290" font-size="12" text-anchor="middle" fill="#78909C">— seta tracejada: caminho de retorno (Entity convertida de volta em DTO) —</text>

  <!-- Legenda inferior -->
  <rect x="60" y="330" width="780" height="100" rx="10" fill="#FAFAFA" stroke="#CFD8DC" stroke-width="1.5"/>
  <text x="450" y="355" font-size="14" font-weight="700" text-anchor="middle" fill="#37474F">Regra de ouro</text>
  <text x="450" y="378" font-size="12" text-anchor="middle" fill="#455A64">O Controller e o Cliente NUNCA enxergam a Entity diretamente.</text>
  <text x="450" y="398" font-size="12" text-anchor="middle" fill="#455A64">O DTO é o "envelope" que trafega para fora; a Entity é o dado interno persistido.</text>
  <text x="450" y="418" font-size="12" text-anchor="middle" fill="#455A64">Somente o Service conhece as duas formas e faz a conversão entre elas.</text>
</svg>
