<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrowF" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#37474F"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="460" fill="#FFFFFF"/>
  <text x="450" y="35" font-size="22" font-weight="700" fill="#263238" text-anchor="middle">Padrão Factory: NotificationFactory</text>

  <!-- Entrada -->
  <rect x="50" y="170" width="160" height="80" rx="10" fill="#ECEFF1" stroke="#546E7A" stroke-width="2"/>
  <text x="130" y="200" font-size="13" font-weight="700" text-anchor="middle" fill="#263238">TaskService</text>
  <text x="130" y="220" font-size="11" text-anchor="middle" fill="#546E7A">pede uma notificação</text>
  <text x="130" y="236" font-size="11" text-anchor="middle" fill="#546E7A">tipo: "EMAIL" | "SMS" | "PUSH"</text>

  <!-- Factory -->
  <rect x="290" y="160" width="200" height="100" rx="10" fill="#F3E5F5" stroke="#8E24AA" stroke-width="2"/>
  <text x="390" y="190" font-size="14" font-weight="700" text-anchor="middle" fill="#4A148C">NotificationFactory</text>
  <text x="390" y="212" font-size="11" text-anchor="middle" fill="#6A1B9A">+ criar(String tipo)</text>
  <text x="390" y="230" font-size="11" text-anchor="middle" fill="#6A1B9A">: Notification</text>
  <text x="390" y="248" font-size="10" text-anchor="middle" fill="#8E24AA">(decide qual objeto instanciar)</text>

  <line x1="210" y1="210" x2="286" y2="210" stroke="#37474F" stroke-width="2" marker-end="url(#arrowF)"/>

  <!-- Interface Notification -->
  <rect x="600" y="60" width="220" height="55" rx="10" fill="#FFF8E1" stroke="#F9A825" stroke-width="2"/>
  <text x="710" y="82" font-size="13" font-weight="700" text-anchor="middle" fill="#F57F17">&#171;interface&#187; Notification</text>
  <text x="710" y="100" font-size="11" text-anchor="middle" fill="#8D6E00">+ enviar(String msg)</text>

  <!-- Três produtos -->
  <rect x="560" y="170" width="130" height="80" rx="10" fill="#E8F5E9" stroke="#388E3C" stroke-width="2"/>
  <text x="625" y="200" font-size="12" font-weight="700" text-anchor="middle" fill="#1B5E20">EmailNotification</text>
  <text x="625" y="220" font-size="10" text-anchor="middle" fill="#2E7D32">envia via SMTP</text>

  <rect x="700" y="170" width="130" height="80" rx="10" fill="#E8F5E9" stroke="#388E3C" stroke-width="2"/>
  <text x="765" y="200" font-size="12" font-weight="700" text-anchor="middle" fill="#1B5E20">SmsNotification</text>
  <text x="765" y="220" font-size="10" text-anchor="middle" fill="#2E7D32">envia via gateway SMS</text>

  <rect x="630" y="280" width="130" height="80" rx="10" fill="#E8F5E9" stroke="#388E3C" stroke-width="2"/>
  <text x="695" y="310" font-size="12" font-weight="700" text-anchor="middle" fill="#1B5E20">PushNotification</text>
  <text x="695" y="330" font-size="10" text-anchor="middle" fill="#2E7D32">envia via push mobile</text>

  <line x1="490" y1="200" x2="556" y2="200" stroke="#37474F" stroke-width="2" marker-end="url(#arrowF)"/>
  <text x="500" y="190" font-size="10" fill="#546E7A">cria e retorna</text>

  <!-- Nota inferior -->
  <rect x="60" y="380" width="780" height="60" rx="10" fill="#FAFAFA" stroke="#CFD8DC" stroke-width="1.5"/>
  <text x="450" y="405" font-size="12" font-weight="700" text-anchor="middle" fill="#37474F">Diferença essencial para o Strategy</text>
  <text x="450" y="425" font-size="12" text-anchor="middle" fill="#455A64">Strategy resolve "qual algoritmo usar"; Factory resolve "qual objeto instanciar". Aqui, a Factory decide a classe concreta de Notification.</text>
</svg>
