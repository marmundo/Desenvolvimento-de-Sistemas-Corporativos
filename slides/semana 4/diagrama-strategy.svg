<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrowS" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#37474F"/>
    </marker>
    <marker id="triangle" markerWidth="14" markerHeight="14" refX="12" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,10 L12,5 z" fill="#FFFFFF" stroke="#37474F" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="480" fill="#FFFFFF"/>
  <text x="450" y="35" font-size="22" font-weight="700" fill="#263238" text-anchor="middle">Padrão Strategy: PriorityStrategy</text>

  <!-- Contexto: TaskService -->
  <rect x="360" y="60" width="180" height="70" rx="10" fill="#E3F2FD" stroke="#1976D2" stroke-width="2"/>
  <text x="450" y="88" font-size="14" font-weight="700" text-anchor="middle" fill="#0D47A1">TaskService</text>
  <text x="450" y="108" font-size="11" text-anchor="middle" fill="#1565C0">(Contexto)</text>
  <text x="450" y="122" font-size="10" text-anchor="middle" fill="#1565C0">usa uma PriorityStrategy</text>

  <!-- Linha de composição -->
  <line x1="450" y1="130" x2="450" y2="175" stroke="#37474F" stroke-width="2" marker-end="url(#arrowS)"/>
  <text x="470" y="155" font-size="11" fill="#546E7A">usa →</text>

  <!-- Interface -->
  <rect x="330" y="175" width="240" height="70" rx="10" fill="#FFF8E1" stroke="#F9A825" stroke-width="2"/>
  <text x="450" y="200" font-size="14" font-weight="700" text-anchor="middle" fill="#F57F17">&#171;interface&#187;</text>
  <text x="450" y="220" font-size="14" font-weight="700" text-anchor="middle" fill="#F57F17">PriorityStrategy</text>
  <text x="450" y="238" font-size="11" text-anchor="middle" fill="#8D6E00">+ calcularPrioridade(Task): int</text>

  <!-- Três implementações -->
  <rect x="60" y="330" width="220" height="90" rx="10" fill="#E8F5E9" stroke="#388E3C" stroke-width="2"/>
  <text x="170" y="358" font-size="13" font-weight="700" text-anchor="middle" fill="#1B5E20">UrgentPriorityStrategy</text>
  <text x="170" y="378" font-size="11" text-anchor="middle" fill="#2E7D32">prazo &lt; 24h</text>
  <text x="170" y="396" font-size="11" text-anchor="middle" fill="#2E7D32">retorna peso máximo</text>

  <rect x="340" y="330" width="220" height="90" rx="10" fill="#E8F5E9" stroke="#388E3C" stroke-width="2"/>
  <text x="450" y="358" font-size="13" font-weight="700" text-anchor="middle" fill="#1B5E20">NormalPriorityStrategy</text>
  <text x="450" y="378" font-size="11" text-anchor="middle" fill="#2E7D32">prazo entre 1 e 7 dias</text>
  <text x="450" y="396" font-size="11" text-anchor="middle" fill="#2E7D32">retorna peso médio</text>

  <rect x="620" y="330" width="220" height="90" rx="10" fill="#E8F5E9" stroke="#388E3C" stroke-width="2"/>
  <text x="730" y="358" font-size="13" font-weight="700" text-anchor="middle" fill="#1B5E20">LowPriorityStrategy</text>
  <text x="730" y="378" font-size="11" text-anchor="middle" fill="#2E7D32">sem prazo definido</text>
  <text x="730" y="396" font-size="11" text-anchor="middle" fill="#2E7D32">retorna peso mínimo</text>

  <!-- Setas de implementação (triângulo vazado) -->
  <line x1="170" y1="330" x2="400" y2="248" stroke="#37474F" stroke-width="1.5" marker-end="url(#triangle)"/>
  <line x1="450" y1="330" x2="450" y2="248" stroke="#37474F" stroke-width="1.5" marker-end="url(#triangle)"/>
  <line x1="730" y1="330" x2="500" y2="248" stroke="#37474F" stroke-width="1.5" marker-end="url(#triangle)"/>

  <!-- Nota lateral -->
  <rect x="60" y="440" width="780" height="30" rx="6" fill="#FAFAFA" stroke="#CFD8DC"/>
  <text x="450" y="460" font-size="12" text-anchor="middle" fill="#455A64">O TaskService não sabe qual estratégia está usando — apenas chama calcularPrioridade(); trocar a estratégia não exige alterar o Service.</text>
</svg>
