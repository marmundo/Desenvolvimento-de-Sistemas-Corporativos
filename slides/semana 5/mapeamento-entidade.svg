<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker></defs>
  <rect width="1280" height="720" fill="#f7f9fc"/>
  <!-- Codigo -->
  <rect x="40" y="120" width="640" height="560" rx="14" fill="#1f2937"/>
  <g font-family="Courier New, monospace" font-size="21">
    <text x="65" y="160" fill="#fbbf24">@Entity</text>
    <text x="65" y="192" fill="#fbbf24">@Table<tspan fill="#e5e7eb">(name = "tarefas")</tspan></text>
    <text x="65" y="224" fill="#93c5fd">public class Task {</text>
    <text x="95" y="280" fill="#fbbf24">@Id</text>
    <text x="95" y="312" fill="#fbbf24">@GeneratedValue<tspan fill="#e5e7eb">(strategy = IDENTITY)</tspan></text>
    <text x="95" y="344" fill="#e5e7eb">private Long id;</text>
    <text x="95" y="400" fill="#fbbf24">@Column<tspan fill="#e5e7eb">(nullable = false, length = 100)</tspan></text>
    <text x="95" y="432" fill="#e5e7eb">private String titulo;</text>
    <text x="95" y="488" fill="#e5e7eb">private String descricao;</text>
    <text x="95" y="544" fill="#e5e7eb">private boolean concluida;</text>
    <text x="95" y="600" fill="#fbbf24">@Enumerated<tspan fill="#e5e7eb">(EnumType.STRING)</tspan></text>
    <text x="95" y="632" fill="#e5e7eb">private Priority prioridade;</text>
    <text x="65" y="668" fill="#93c5fd">}</text>
  </g>
  <!-- Tabela -->
  <rect x="810" y="120" width="430" height="560" rx="14" fill="#ffffff" stroke="#15803d" stroke-width="3"/>
  <rect x="810" y="120" width="430" height="50" rx="14" fill="#15803d"/>
  <text x="1025" y="153" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">TABELA tarefas</text>
  <g font-family="Courier New, monospace" font-size="20" fill="#1f2937">
    <text x="830" y="312">id  BIGINT  PK, auto</text>
    <text x="830" y="432">titulo  VARCHAR(100)</text>
    <text x="830" y="465" font-size="17" fill="#6b7280">NOT NULL</text>
    <text x="830" y="488">descricao  VARCHAR(255)</text>
    <text x="830" y="544">concluida  BOOLEAN</text>
    <text x="830" y="632">prioridade  VARCHAR(255)</text>
  </g>
  <!-- setas -->
  <g stroke="#d97706" stroke-width="3" fill="none" marker-end="url(#a)">
    <path d="M685 192 C740 192 760 150 806 150"/>
    <path d="M685 306 L806 306"/>
    <path d="M685 426 L806 426"/>
    <path d="M685 482 L806 482"/>
    <path d="M685 538 L806 538"/>
    <path d="M685 626 L806 626"/>
  </g>
  <text x="745" y="112" font-size="16" fill="#b45309" text-anchor="middle">nome da tabela</text>
</svg>
