<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#374151"/></marker></defs>
  <rect width="1280" height="720" fill="#f7f9fc"/>
  <!-- caixas -->
  <g font-size="20" font-weight="bold" text-anchor="middle">
    <rect x="30" y="220" width="180" height="120" rx="12" fill="#e8f0fe" stroke="#1a56db" stroke-width="3"/>
    <text x="120" y="268" fill="#1a56db">TaskService</text>
    <text x="120" y="298" font-size="15" font-weight="normal" fill="#1f2937">chama métodos</text>
    <text x="120" y="320" font-size="15" font-weight="normal" fill="#1f2937">do repositório</text>

    <rect x="255" y="220" width="200" height="120" rx="12" fill="#e8f0fe" stroke="#1a56db" stroke-width="3"/>
    <text x="355" y="268" fill="#1a56db">TaskRepository</text>
    <text x="355" y="298" font-size="15" font-weight="normal" fill="#1f2937">interface escrita</text>
    <text x="355" y="320" font-size="15" font-weight="normal" fill="#1f2937">por você</text>

    <rect x="500" y="220" width="200" height="120" rx="12" fill="#fff4e0" stroke="#d97706" stroke-width="3"/>
    <text x="600" y="268" fill="#b45309">Proxy Spring Data</text>
    <text x="600" y="298" font-size="15" font-weight="normal" fill="#1f2937">implementação gerada</text>
    <text x="600" y="320" font-size="15" font-weight="normal" fill="#1f2937">na inicialização</text>

    <rect x="745" y="220" width="200" height="120" rx="12" fill="#fff4e0" stroke="#d97706" stroke-width="3"/>
    <text x="845" y="268" fill="#b45309">Hibernate</text>
    <text x="845" y="298" font-size="15" font-weight="normal" fill="#1f2937">EntityManager traduz</text>
    <text x="845" y="320" font-size="15" font-weight="normal" fill="#1f2937">objetos em SQL</text>

    <rect x="990" y="220" width="130" height="120" rx="12" fill="#f3e8ff" stroke="#7e22ce" stroke-width="3"/>
    <text x="1055" y="268" fill="#7e22ce">JDBC</text>
    <text x="1055" y="298" font-size="15" font-weight="normal" fill="#1f2937">pool Hikari</text>
    <text x="1055" y="320" font-size="15" font-weight="normal" fill="#1f2937">de conexões</text>

    <rect x="1150" y="220" width="110" height="120" rx="12" fill="#e6f6ec" stroke="#15803d" stroke-width="3"/>
    <text x="1205" y="268" fill="#15803d">Banco</text>
    <text x="1205" y="298" font-size="15" font-weight="normal" fill="#1f2937">H2 ou</text>
    <text x="1205" y="320" font-size="15" font-weight="normal" fill="#1f2937">PostgreSQL</text>
  </g>
  <!-- setas -->
  <g stroke="#374151" stroke-width="3" marker-end="url(#a)">
    <line x1="212" y1="280" x2="252" y2="280"/>
    <line x1="457" y1="280" x2="497" y2="280"/>
    <line x1="702" y1="280" x2="742" y2="280"/>
    <line x1="947" y1="280" x2="987" y2="280"/>
    <line x1="1122" y1="280" x2="1147" y2="280"/>
  </g>
  <!-- legendas -->
  <g font-size="19" text-anchor="middle" fill="#374151">
    <rect x="30" y="395" width="425" height="8" rx="4" fill="#1a56db"/>
    <text x="242" y="440" font-weight="bold" fill="#1a56db">Código que você escreve</text>
    <rect x="500" y="395" width="445" height="8" rx="4" fill="#d97706"/>
    <text x="722" y="440" font-weight="bold" fill="#b45309">Trabalho que o Spring Data JPA assume</text>
    <rect x="990" y="395" width="270" height="8" rx="4" fill="#15803d"/>
    <text x="1125" y="440" font-weight="bold" fill="#15803d">Infraestrutura</text>
  </g>
  <!-- analogia -->
  <rect x="200" y="500" width="880" height="170" rx="16" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
  <text x="640" y="540" font-size="22" font-weight="bold" fill="#374151" text-anchor="middle">Analogia: o restaurante</text>
  <g font-size="19" fill="#1f2937" text-anchor="middle">
    <text x="640" y="580">O Service é o cliente, a interface Repository é o cardápio.</text>
    <text x="640" y="610">O Spring Data é a cozinha que prepara o pedido sem você escrever a receita.</text>
    <text x="640" y="640">O Hibernate e o JDBC são o entregador que busca os ingredientes no estoque (banco).</text>
  </g>
</svg>
