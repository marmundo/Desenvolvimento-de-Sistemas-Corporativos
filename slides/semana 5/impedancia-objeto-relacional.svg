<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Helvetica, Arial, sans-serif">
  <rect width="1280" height="720" fill="#f7f9fc"/>
  <!-- Mundo Java -->
  <rect x="50" y="130" width="400" height="330" rx="16" fill="#e8f0fe" stroke="#1a56db" stroke-width="3"/>
  <text x="250" y="168" font-size="24" font-weight="bold" fill="#1a56db" text-anchor="middle">Mundo Java (objetos)</text>
  <rect x="90" y="195" width="320" height="235" rx="8" fill="#ffffff" stroke="#1a56db" stroke-width="2"/>
  <rect x="90" y="195" width="320" height="42" rx="8" fill="#1a56db"/>
  <text x="250" y="224" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">class Task</text>
  <g font-family="Courier New, monospace" font-size="20" fill="#1f2937">
    <text x="110" y="275">Long id</text>
    <text x="110" y="310">String titulo</text>
    <text x="110" y="345">String descricao</text>
    <text x="110" y="380">boolean concluida</text>
    <text x="110" y="415">Priority prioridade</text>
  </g>
  <!-- Mundo Relacional -->
  <rect x="830" y="130" width="400" height="330" rx="16" fill="#e6f6ec" stroke="#15803d" stroke-width="3"/>
  <text x="1030" y="168" font-size="24" font-weight="bold" fill="#15803d" text-anchor="middle">Mundo Relacional (tabelas)</text>
  <rect x="870" y="195" width="320" height="235" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="2"/>
  <rect x="870" y="195" width="320" height="42" rx="8" fill="#15803d"/>
  <text x="1030" y="224" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">TABELA tarefas</text>
  <g font-family="Courier New, monospace" font-size="20" fill="#1f2937">
    <text x="890" y="275">id BIGINT PK</text>
    <text x="890" y="310">titulo VARCHAR</text>
    <text x="890" y="345">descricao VARCHAR</text>
    <text x="890" y="380">concluida BOOLEAN</text>
    <text x="890" y="415">prioridade VARCHAR</text>
  </g>
  <!-- ORM no centro -->
  <rect x="520" y="235" width="240" height="150" rx="75" fill="#fff4e0" stroke="#d97706" stroke-width="3"/>
  <text x="640" y="295" font-size="26" font-weight="bold" fill="#b45309" text-anchor="middle">ORM</text>
  <text x="640" y="325" font-size="20" fill="#b45309" text-anchor="middle">Hibernate</text>
  <text x="640" y="352" font-size="16" fill="#b45309" text-anchor="middle">o tradutor</text>
  <path d="M452 310 L516 310" stroke="#d97706" stroke-width="4" marker-end="url(#a)"/>
  <path d="M764 310 L826 310" stroke="#d97706" stroke-width="4" marker-end="url(#a)"/>
  <path d="M826 340 L764 340" stroke="#d97706" stroke-width="4" marker-end="url(#a)"/>
  <path d="M516 340 L452 340" stroke="#d97706" stroke-width="4" marker-end="url(#a)"/>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker></defs>
  <!-- Descompassos -->
  <text x="640" y="510" font-size="22" font-weight="bold" fill="#374151" text-anchor="middle">Os quatro descompassos que o ORM precisa resolver</text>
  <g font-size="18" fill="#1f2937">
    <rect x="50" y="530" width="290" height="150" rx="12" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
    <text x="195" y="562" text-anchor="middle" font-weight="bold">Identidade</text>
    <text x="195" y="595" text-anchor="middle">equals() / ==</text>
    <text x="195" y="620" text-anchor="middle">versus</text>
    <text x="195" y="645" text-anchor="middle">chave primária</text>

    <rect x="360" y="530" width="290" height="150" rx="12" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
    <text x="505" y="562" text-anchor="middle" font-weight="bold">Associações</text>
    <text x="505" y="595" text-anchor="middle">referência a objeto</text>
    <text x="505" y="620" text-anchor="middle">versus</text>
    <text x="505" y="645" text-anchor="middle">chave estrangeira</text>

    <rect x="670" y="530" width="290" height="150" rx="12" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
    <text x="815" y="562" text-anchor="middle" font-weight="bold">Tipos de dados</text>
    <text x="815" y="595" text-anchor="middle">enum, LocalDateTime</text>
    <text x="815" y="620" text-anchor="middle">versus</text>
    <text x="815" y="645" text-anchor="middle">tipos SQL</text>

    <rect x="980" y="530" width="250" height="150" rx="12" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
    <text x="1105" y="562" text-anchor="middle" font-weight="bold">Herança</text>
    <text x="1105" y="595" text-anchor="middle">hierarquia de classes</text>
    <text x="1105" y="620" text-anchor="middle">versus</text>
    <text x="1105" y="645" text-anchor="middle">tabelas planas</text>
  </g>
</svg>
